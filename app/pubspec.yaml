name: opencyclo_app
description: "OpenCyclo BLE Companion and Wireless OTA Manager for Android & iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.0
  flutter_foreground_task: ^10.0.0
  file_picker: ^8.1.7
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Arimo is metrically compatible with Helvetica/Arial, which is what the
  # device's FreeSans faces clone — so the app and the ESP32 panel render text
  # with the same proportions. Bundled rather than fetched at runtime: this is
  # an outdoors cycling companion, and a font that only arrives over the network
  # would silently fall back to Roboto exactly when the rider is offline.
  # Latin subset, ~21 KB per weight.
  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo-Bold.ttf
          weight: 700
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"

