name: Play upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload to internal testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane

      # Same guard as android-release.yml: without the real keystore Gradle
      # falls back to the debug key, so stop before building anything.
      - name: Write signing config
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are not set - see docs/android-release.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.p12
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.p12\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties

      - name: Build bundle
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload to the internal testing track
        working-directory: app/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::PLAY_STORE_JSON_KEY is not set - see docs/play-console-setup.md"
            exit 1
          fi
          printf '%s' "$PLAY_STORE_JSON_KEY" > "$PLAY_STORE_JSON_KEY_PATH"
          fastlane internal
